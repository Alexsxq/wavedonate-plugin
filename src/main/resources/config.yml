# ─────────────────────────────────────────────────────────────
#  WaveDonate — выдача покупок с сайта на сервер
#  Кабинет: https://lk.wdonate.wtf → Магазины → ваш магазин → Плагин
#  Быстрое подключение: в консоли сервера  wd setup <ключ> [server-id]
#  Команды: /wd status · /wd ping · /wd check · /wd queue · /wd test · /wd reload
# ─────────────────────────────────────────────────────────────

settings:
  # Адрес API. Менять не нужно.
  api-url: "https://api.wdonate.wtf"

  # Ключ магазина из кабинета (вкладка «Плагин»). Никому его не показывайте.
  shop-key: "PASTE_SHOP_KEY_HERE"

  # ID режима из кабинета (вкладка «Серверы»). Нужен, если режимов несколько:
  # плагин стоит на каждом сервере, ключ один, а server-id у каждого свой.
  # 0 — один сервер, плагин выдаёт все заказы магазина.
  server-id: 0

  # Как часто проверять новые оплаты, в секундах (минимум 5).
  request-delay-seconds: 20

  # Сколько ждать ответа API, в секундах.
  timeout-seconds: 10

  # Подробный лог в консоль.
  debug: false

delivery:
  # true — выдавать покупку только когда игрок на сервере: оплата подождёт его входа.
  # false — выдавать сразу (подходит для LuckPerms, валюты и всего, что работает с оффлайн-игроками).
  require-online: false

  # Через сколько секунд после входа игрока выдавать отложенные покупки.
  join-delay-seconds: 3

# Что увидит игрок после выдачи. Плейсхолдеры:
#   %player% — ник, %product% — товар, %amount% — сумма в ₽, %order% — номер заказа,
#   %from% — кто подарил (или сам игрок), %quantity% — количество валюты
# Цвета: &a, &l … и HEX: &#ff8800
notify:
  message: "&#4fbcd6WaveDonate &8» &fСпасибо за покупку &#4fbcd6%product%&f!"
  title:
    enabled: true
    title: "&#4fbcd6Спасибо!"
    subtitle: "&f%product% уже у вас"
    stay-ticks: 50
  # Звук: ключ из Minecraft, можно добавить громкость и высоту: entity.player.levelup|1|1.2
  # Пусто — без звука.
  sound: "entity.player.levelup"
  broadcast:
    enabled: false
    text: "&#4fbcd6%player% &fподдержал сервер и купил &#4fbcd6%product%&f!"
  # товар для /wd test
  test-product: "VIP"

# В командах товара (в кабинете) можно использовать действия:
#   give %player% diamond 1                — обычная команда от консоли
#   [player] kit vip                       — от имени игрока (нужен онлайн)
#   [message] &aВаш кит готов!             — сообщение игроку
#   [broadcast] &e%player% купил %product% — сообщение всем
#   [title] &6Ура!|&fПокупка выдана         — заголовок|подзаголовок
#   [actionbar] &aПокупка выдана           — строка над хотбаром
#   [sound] entity.experience_orb.pickup   — звук игроку
#   [delay:5] give %player% diamond 1      — выполнить через 5 секунд после предыдущей

messages:
  prefix: "&#4fbcd6WaveDonate &8» "
  no-permission: "&cНедостаточно прав."
  reload: "&aКонфиг перезагружен."
  status-bad-key: "&cУкажите shop-key в plugins/WaveDonate/config.yml и выполните /wd reload."
  ping-wait: "&7Проверяю связь…"
  ping-ok: "&aВсё работает: ключ верный, API отвечает за {ms} мс."
  ping-fail: "&cНе получилось: &f{error}"
  check: "&7Проверяю новые оплаты…"
  queue-empty: "&aНичего не ждёт выдачи."
  test: "&aУведомление показано игроку {player}."
